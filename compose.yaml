name: log-analyzer-test

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.21
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.license.self_generated.type: basic
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    mem_limit: 1g
    ports:
      - "127.0.0.1:19200:9200"
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow' || exit 1
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    volumes:
      - es-test-data:/usr/share/elasticsearch/data

  test:
    build:
      context: .
      dockerfile: Dockerfile.test
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      LOG_ANALYZER_TEST_ES_URL: http://elasticsearch:9200
    command: ["python", "-m", "unittest", "discover", "-s", "tests", "-v"]

volumes:
  es-test-data:
