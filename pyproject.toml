[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "log-analyzer"
version = "0.2.0"
description = "Standalone Java error log analyzer"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "aiohttp>=3.9,<4",
    "elasticsearch>=8,<9",
    "httpx>=0.27,<1",
    "pydantic>=2,<3",
]

[project.urls]
Repository = "https://github.com/lahuman/logAnalysis"
Documentation = "https://github.com/lahuman/logAnalysis/blob/main/README.md"
Issues = "https://github.com/lahuman/logAnalysis/issues"

[tool.setuptools.packages.find]
where = ["src"]
